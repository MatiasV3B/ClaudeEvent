<meta property="og:description" content="Formulario anónimo de gustos e intereses.">
<link rel="icon" href="favicon.svg" type="image/svg+xml">

<style>
:root{--bg:#F5F4ED;--chip:#EBE8DC;--fg:#141413;--muted:#5E5D59;--line:#D8D4C6;--accent:#C96442;--accent-d:#B5563A;--ink:#141413;--onink:#FAF9F5;--f-head:"Source Serif 4",Georgia,serif;--f-body:"Inter",system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root{--bg:#141413;--chip:#262624;--fg:#FAF9F5;--muted:#A8A69C;--line:#3F3E3A;--accent:#D97757;--accent-d:#E58A6B;--ink:#FAF9F5;--onink:#141413;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:16px;line-height:1.6;min-height:100vh;padding:20px 16px 56px}
.wrap{max-width:680px;margin:0 auto}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:44px}
.brand{display:flex;align-items:center;gap:8px;font-family:var(--f-head);font-size:1.25rem;letter-spacing:-.01em}
.pill:empty{display:none}
.pill{background:var(--chip);border:1px solid var(--line);border-radius:99px;padding:4px 14px;font-size:.85rem;color:var(--muted)}
.prog{height:3px;background:var(--chip);border-radius:99px;overflow:hidden;margin-bottom:10px}
.prog i{display:block;height:100%;width:0;background:var(--accent);transition:width .5s cubic-bezier(.2,.8,.2,1)}
main{animation:rise .45s ease backwards}
.lead{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:.9rem;margin:0 0 14px}
h1,h2{font-family:var(--f-head);font-weight:400;letter-spacing:-.015em;line-height:1.12;margin:0 0 14px;text-wrap:balance}
h1{font-size:clamp(2.3rem,8vw,3.6rem)} h2{font-size:clamp(1.8rem,6vw,2.5rem)}
p{margin:0 0 14px;max-width:60ch} .muted{color:var(--muted);font-size:.95rem}
.opts{display:flex;flex-direction:column;gap:8px;margin:24px 0 0}
.opt{font:inherit;color:inherit;text-align:left;background:transparent;border:1px solid var(--line);border-radius:14px;padding:13px 16px;cursor:pointer;display:flex;gap:12px;align-items:center;min-height:50px;transition:background .15s,border-color .15s}
.opt:hover{background:var(--chip)}
.opt:focus-visible,.btn:focus-visible,textarea:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.opt .dot{flex:none;width:18px;height:18px;border:1.5px solid var(--muted);border-radius:50%;display:grid;place-items:center}
.multi .opt .dot{border-radius:5px}
.opt[aria-pressed="true"]{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,transparent)}
.opt[aria-pressed="true"] .dot{background:var(--accent);border-color:var(--accent)}
.opt[aria-pressed="true"] .dot::after{content:"";width:6px;height:6px;background:#fff;border-radius:50%}
.multi .opt[aria-pressed="true"] .dot::after{border-radius:1px;width:8px;height:8px}
.mascot{height:96px;width:auto;image-rendering:pixelated;display:block;margin:0 0 14px;animation:pop .6s cubic-bezier(.2,.9,.3,1.3) backwards}
.say{display:flex;gap:10px;align-items:flex-start;margin:18px 0 0;padding:12px 16px;background:var(--chip);border-radius:14px;font-size:.95rem;animation:pop .35s ease backwards}

.other{display:none;width:100%;margin-top:10px;font:inherit;color:inherit;background:transparent;border:1px solid var(--accent);border-radius:14px;padding:12px 14px}
.other:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
textarea{width:100%;min-height:130px;margin-top:24px;font:inherit;color:inherit;background:transparent;border:1px solid var(--line);border-radius:14px;padding:14px;resize:vertical}
.nav{display:flex;justify-content:space-between;gap:12px;margin-top:28px;align-items:center}
.btn{font:inherit;font-weight:500;border-radius:10px;padding:12px 24px;min-height:46px;cursor:pointer;border:1px solid var(--line);background:transparent;color:var(--fg)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover:not(:disabled){background:var(--accent-d);border-color:var(--accent-d)}
.btn:disabled{opacity:.35;cursor:not-allowed}
.foot{margin-top:48px;font-size:.8rem;color:var(--muted);max-width:60ch}
.facts{display:flex;gap:8px;flex-wrap:wrap;list-style:none;padding:0;margin:20px 0}
.err{color:#B3261E;font-size:.9rem;margin:12px 0 0;min-height:1.2em}
@keyframes rise{from{opacity:0;transform:translateY(12px)}} @keyframes pop{from{opacity:0;transform:scale(.97)}}
.out{animation:out .18s ease forwards} @keyframes out{to{opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

const isSelO=v=>typeof v=="string"&&v.startsWith("Otra: ");

 const upd=()=>{next.disabled=!n.opt&&!ok()};

 else{const box=$("div","opts"+(n.type=="multi"?" multi":""));
